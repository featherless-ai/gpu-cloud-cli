stages:
  - test
  - build
  - publish

.go:
  image: golang:1.27-bookworm
  timeout: 20 minutes
  interruptible: true
  tags:
    - platform
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"

lint:
  extends: .go
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - go vet ./...
    - GOOS=windows go vet ./...
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

unit-tests:
  extends: .go
  before_script:
    # The completion tests run the generated scripts in real bash and zsh.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zsh >/dev/null
  script:
    - go run gotest.tools/gotestsum@latest --junitfile junit.xml -- -race ./...
  artifacts:
    when: always
    reports:
      junit: junit.xml

# Every platform's binary, laid out as the npm packages publish uploads.
build:
  extends: .go
  stage: build
  needs: []
  script:
    - scripts/build-npm.sh
    - dist/npm/gpu-cloud-cli-linux-x64/bin/featherless-cloud --version
  artifacts:
    paths:
      - dist/npm/
    expire_in: 1 week

# Merging a version bump to main publishes it to npm and tags v<version>.
# The platform packages go first, so the package people install never points
# at a version that isn't there. Each step skips what is already published,
# so a retried job finishes the rest. NPM_TOKEN is a masked, protected CI
# variable holding an npm automation token.
publish:
  stage: publish
  image: node:22-alpine
  needs: [build, lint, unit-tests]
  tags:
    - platform
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - |
      for dir in dist/npm/gpu-cloud-cli-*/ dist/npm/gpu-cloud-cli/; do
        name=$(node -p "require('./$dir/package.json').name")
        if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
          echo "$name@$VERSION is already published."
          continue
        fi
        (cd "$dir" && npm publish --access public)
      done
    # The Releases API accepts the job token and creates the tag at this commit.
    - |
      if ! curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/v$VERSION" >/dev/null; then
        curl --fail-with-body -sS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" \
          -d "{\"tag_name\": \"v$VERSION\", \"ref\": \"$CI_COMMIT_SHA\", \"name\": \"v$VERSION\"}" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      fi
