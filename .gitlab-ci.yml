stages:
  - test
  - publish

.node-test:
  stage: test
  image: node:22-alpine
  timeout: 20 minutes
  interruptible: true
  tags:
    - platform
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # No cache: the runner has no shared cache server, so a saved store never
  # reached the next job's runner session and saving it cost 20-25s per job.
  before_script:
    # The version script's tests drive a scratch git repository.
    - apk add --no-cache git
    - corepack enable && corepack prepare pnpm@10.4.1 --activate
    - pnpm install --frozen-lockfile
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"

lint:
  extends: .node-test
  script:
    - pnpm lint

typecheck:
  extends: .node-test
  script:
    - pnpm typecheck

unit-tests:
  extends: .node-test
  before_script:
    # The version tests drive a scratch git repository; the completion
    # tests run the generated scripts in bash and zsh.
    - apk add --no-cache git bash zsh
    - !reference [.node-test, before_script]
  script:
    - pnpm test --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

build:
  extends: .node-test
  script:
    - pnpm build
    - node dist/index.js --version
    - npm pack --dry-run

# Merging a version bump to main publishes it to npm and tags v<version>.
# NPM_TOKEN is a masked, protected CI variable holding an npm automation token.
publish:
  extends: .node-test
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl
    - !reference [.node-test, before_script]
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "$(npm view @featherlessai/gpu-cloud-cli@$VERSION version 2>/dev/null)" = "$VERSION" ]; then
        echo "$VERSION is already published."
        exit 0
      fi
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access public
    # The Releases API accepts the job token and creates the tag at this commit.
    - >
      curl --fail-with-body -sS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json"
      -d "{\"tag_name\": \"v$VERSION\", \"ref\": \"$CI_COMMIT_SHA\", \"name\": \"v$VERSION\"}"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
