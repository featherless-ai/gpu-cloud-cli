name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish without uploading to npm (validates packaging and auth)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The completion tests run the generated scripts in real bash and zsh.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh
      - name: Run tests
        run: go run gotest.tools/gotestsum@latest --junitfile junit.xml -- -race ./...
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml

  # Every platform's binary, laid out as the npm packages publish uploads.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build npm packages
        run: scripts/build-npm.sh
      - name: Smoke the linux binary
        run: dist/npm/gpu-cloud-cli-linux-x64/bin/featherless-cloud --version
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/
          retention-days: 7

  # A push to main publishes what the version bump asks for: the platform
  # packages first, so the package people install never points at a version
  # that isn't there. Each package skips a version already published, so a
  # retried run finishes the rest. NPM_TOKEN is a repository secret holding an
  # npm automation token.
  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then PUBLISH_FLAGS="--dry-run"; fi
          for dir in dist/npm/gpu-cloud-cli-*/ dist/npm/gpu-cloud-cli/; do
            name=$(node -p "require('./$dir/package.json').name")
            # A dry run exists to inspect the tarballs, so it never skips.
            if [ -z "$PUBLISH_FLAGS" ] && [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already published."
              continue
            fi
            (cd "$dir" && npm publish --access public $PUBLISH_FLAGS)
          done
      - name: Tag and release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
